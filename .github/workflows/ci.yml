name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22

  no-runtime-deps:
    # The rule this project is built on: package.json carries no `dependencies`
    # key. A tool that handles passwords keeps its supply chain at zero, and a
    # reviewer should not be the only thing standing between a convenience import
    # and a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node -e '
            const pkg = require("./package.json");
            const runtime = Object.keys(pkg.dependencies ?? {});
            if (runtime.length) {
              console.error("package.json must carry no dependencies, found: " + runtime.join(", "));
              process.exit(1);
            }
            console.log("no runtime dependencies");
          '
